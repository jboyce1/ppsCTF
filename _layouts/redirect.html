<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Workrole page moved</title>
  <link rel="canonical" href="{{ page.redirect_to | absolute_url }}">
  <noscript><meta http-equiv="refresh" content="0; url={{ page.redirect_to | relative_url }}"></noscript>
</head>
<body>
  <p>This workrole has moved. <a href="{{ page.redirect_to | relative_url }}">Open its new page.</a></p>
  <script>location.replace({{ page.redirect_to | relative_url | jsonify }} + location.search + location.hash);</script>
</body>
</html>
